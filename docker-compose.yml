services:
  # Dedicated local-development PostgreSQL for Amazon-AI-Fulfillment-Agent.
  # Project-scoped name/volume/port deliberately chosen to avoid colliding
  # with unrelated Postgres containers already running on this machine
  # (host port 5432 is occupied by another project's container).
  postgres:
    image: postgres:16-alpine
    container_name: amazon-fulfillment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amazon_fulfillment}
      POSTGRES_USER: ${POSTGRES_USER:-amazon_fulfillment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - amazon_fulfillment_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amazon_fulfillment} -d ${POSTGRES_DB:-amazon_fulfillment}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-amazon_fulfillment}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-amazon_fulfillment}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - internal
    # Exactly one instance: backend state is in-memory, not shared across
    # processes/containers. Do not scale this service.
    deploy:
      replicas: 1

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - backend
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN}
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - internal

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
  amazon_fulfillment_postgres_data:
