name: amazon-ai-fulfillment-agent
services:
  backend:
    build:
      context: D:\Amazon-AI-Fulfillment-Agent\backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    deploy:
      replicas: 1
    environment:
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      APP_ENV: development
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://amazon_fulfillment:jCqkh3_zQH7oUbwfCQES9I6egnGd2LuW@postgres:5432/amazon_fulfillment
      DEFAULT_ORGANIZATION_ID: 9a32c88e-fe0c-48e0-87e8-f9785e1cc50a
      FRONTEND_PORT: "3000"
      GOOGLE_SHEETS_CREDENTIALS_PATH: backend/credentials/amazon-fulfillment-agent-117e44d6db29.json
      JWT_ALGORITHM: HS256
      POSTGRES_DB: amazon_fulfillment
      POSTGRES_PASSWORD: jCqkh3_zQH7oUbwfCQES9I6egnGd2LuW
      POSTGRES_USER: amazon_fulfillment
      SECRET_KEY: dev-local-only-secret-do-not-use-in-production-a1b2c3
      SHEET_ID: 1huZFTi7NTzf-evJ63BjuizfovDLUH0ETVJUbJA0Npmg
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    networks:
      internal: null
    restart: unless-stopped
  caddy:
    depends_on:
      backend:
        condition: service_started
        required: true
      frontend:
        condition: service_started
        required: true
    environment:
      API_DOMAIN: ""
      FRONTEND_DOMAIN: ""
    image: caddy:2-alpine
    networks:
      internal: null
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
      - mode: ingress
        target: 443
        published: "443"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: D:\Amazon-AI-Fulfillment-Agent\deploy\Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: true
      - type: volume
        source: caddy_data
        target: /data
        volume: {}
      - type: volume
        source: caddy_config
        target: /config
        volume: {}
  frontend:
    build:
      context: D:\Amazon-AI-Fulfillment-Agent\frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_started
        required: true
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'require(''http'').get(''http://127.0.0.1:3000'', r => process.exit(r.statusCode < 500 ? 0 : 1)).on(''error'', () => process.exit(1))'
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    networks:
      internal: null
    restart: unless-stopped
  postgres:
    container_name: amazon-fulfillment-postgres
    environment:
      POSTGRES_DB: amazon_fulfillment
      POSTGRES_PASSWORD: jCqkh3_zQH7oUbwfCQES9I6egnGd2LuW
      POSTGRES_USER: amazon_fulfillment
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U amazon_fulfillment -d amazon_fulfillment
      timeout: 5s
      interval: 10s
      retries: 5
      start_period: 10s
    image: postgres:16-alpine
    networks:
      internal: null
    ports:
      - mode: ingress
        target: 5432
        published: "5434"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: amazon_fulfillment_postgres_data
        target: /var/lib/postgresql/data
        volume: {}
networks:
  internal:
    name: amazon-ai-fulfillment-agent_internal
volumes:
  amazon_fulfillment_postgres_data:
    name: amazon-ai-fulfillment-agent_amazon_fulfillment_postgres_data
  caddy_config:
    name: amazon-ai-fulfillment-agent_caddy_config
  caddy_data:
    name: amazon-ai-fulfillment-agent_caddy_data
